version: '3.8'

services:
  # 1. NAGARA AI Application Server (Frontend SPA + Node.js REST API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagara_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://nagara_admin:nagara_secure_pass@postgres:5432/nagara_db?schema=public
      - MONGODB_URI=mongodb://mongo:27017/nagara_telemetry
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nagara_ai_docker_production_jwt_secret_2026
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - nagara_network

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: nagara_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nagara_admin
      POSTGRES_PASSWORD: nagara_secure_pass
      POSTGRES_DB: nagara_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nagara_network

  # 3. MongoDB NoSQL Database (Sensor Telemetry & Time Series)
  mongo:
    image: mongo:7.0
    container_name: nagara_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nagara_network

  # 4. Redis In-Memory Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: nagara_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nagara_network

networks:
  nagara_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
