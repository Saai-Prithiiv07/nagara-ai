name: NAGARA AI - Automated CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality-and-tests:
    name: Lint, Typecheck & Comprehensive Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Execute Vitest Algorithmic & Backend Integration Test Suites
        run: npm test

      - name: Build Production Frontend Artifacts
        run: npm run build

      - name: Verify Docker Container Build
        run: docker build -t nagara-ai:ci-test .
